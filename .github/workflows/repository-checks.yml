name: Repository checks
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository conventions
        run: python scripts/check_repository.py
      - name: Check whitespace
        run: git show --format= --check HEAD
