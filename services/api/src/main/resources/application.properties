spring.application.name=chamamothanmal-api
# Start from services/api. Local .env wins over root .env; OS environment overrides both.
spring.config.import=optional:file:../../.env[.properties],optional:file:./.env[.properties]
server.address=${API_HOST:127.0.0.1}
server.port=${API_PORT:8000}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
spring.datasource.url=${API_DB_URL:jdbc:h2:file:./data/messages;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${API_DB_USER:sa}
spring.datasource.password=${API_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=${API_MAX_AUDIO_BYTES:5242880}B
spring.servlet.multipart.max-request-size=6MB
app.environment=${APP_ENV:development}
app.upload-dir=${API_UPLOAD_DIR:./uploads}
app.max-audio-bytes=${API_MAX_AUDIO_BYTES:5242880}
app.max-audio-seconds=${API_MAX_AUDIO_SECONDS:15}
app.timezone=${API_TIMEZONE:Asia/Seoul}
app.cors-origins=${API_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.sender-token=${API_SENDER_TOKEN:}
app.recipient-token=${API_RECIPIENT_TOKEN:}
app.other-recipient-token=${API_OTHER_RECIPIENT_TOKEN:}

# Final proposal v3 API; legacy tables remain intact in local mode.
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-v2.sql
app.auth-mode=${API_AUTH_MODE:local}
app.storage-mode=${API_STORAGE_MODE:local}
app.supabase-url=${SUPABASE_URL:}
app.supabase-publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
app.supabase-service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase-bucket=${SUPABASE_STORAGE_BUCKET:voices}
app.cleanup-enabled=${API_CLEANUP_ENABLED:true}

# Server-only Kakao Local REST key. Blank disables only place search, not the server.
app.places.kakao-key=${KAKAO_REST_API_KEY:}
